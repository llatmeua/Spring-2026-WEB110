<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<body>
<div id="wrapper">

<header>
<h1>What Makes a Strong Friendship?</h1>
</header>

<nav>

<main>

<form>

<label for="name">Name:</label>
<input type="text" id="name" name="name">

<p>What matters most in friendship?</p>
<label><input type="checkbox" name="values"> Trust</label>
<label><input type="checkbox" name="values"> Loyalty</label>
<label><input type="checkbox" name="values"> Honesty</label>

<p>Favorite theme in games?</p>
<label><input type="radio" name="theme"> Friendship</label>
<label><input type="radio" name="theme"> Adventure</label>
<label><input type="radio" name="theme"> Survival</label>

<p>Favorite genre:</p>
<select name="genre">
<option>RPG</option>
<option>Shooter</option>
<option>Simulation</option>
</select>

<label for="date">Date:</label>
<input type="date" id="date" name="date">

<p>Your experience:</p>
<textarea rows="4" cols="40"></textarea>

<br><br>

<input type="submit">
<input type="reset">

</form>

</main>
